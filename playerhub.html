<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Загрузка...</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const show = (params.get('show') || '').toLowerCase();

    const map = {
      got: 'players/got.html',
      sopranos: 'players/sopranos.html',
      skins: 'players/skins.html',
      misfits: 'players/misfits.html',
      peaky: 'players/peaky.html',
      shameless: 'players/shameles.html',
      hollywood: 'players/hollywood.html',
      wolf: 'players/wolf.html'
    };

    const target = map[show];
    if (target) {
      window.location.replace(target);
    } else {
      window.location.replace('index.html');
    }
  </script>
</head>
<body></body>
</html>
